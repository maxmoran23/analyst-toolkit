name: validate

on:
  push:
    branches: [main]
  pull_request:

# A superseded run on the same ref carries no information — cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Content, navigation, generation, boundary, and quant regressions
        run: python3 _tooling/check.py

  quant-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
      # The repo deliberately ships no gradle-wrapper.jar/gradlew/gradlew.bat —
      # executable archive members trip enterprise download gateways (see
      # quant-jvm/README.md). CI provisions the pinned Gradle version instead.
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
        with:
          gradle-version: "8.10.2"
      - name: Kotlin / Python parity suite
        working-directory: quant-jvm
        run: gradle test --no-daemon

  presentation-preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install the injector's declared runtime
        run: python3 -m pip install python-pptx
      - name: Template theme, master, layout, and logo remain unchanged
        run: |
          python3 validation/scripts/verify_theme_preservation.py \
            --template samples/presentations/northstar-branded-template.pptx \
            --output samples/presentations/northstar-injected-output.pptx \
            --plan samples/presentations/sample-slide-plan.json \
            --json /tmp/theme-preservation.json \
            --report /tmp/theme-preservation.md

  evidence:
    # Attestation. The `frameworks` job below proves the safety gates still hold;
    # this job proves the COMMITTED evidence is what the current code produces.
    # Without it a VALIDATION-REPORT could drift from the engine it describes and no
    # build would notice — "numbers are emitted, never authored" would be an honour
    # system. Every commit to main re-derives all registered packs from seed in GitHub-hosted CI;
    # that public run history records the reproduction checks.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Committed evidence re-derives from seed (metrics + report)
        run: python3 _tooling/verify_evidence.py

      - name: EVIDENCE.md is generated, not hand-edited
        run: python3 _tooling/build_evidence_index.py --check

  frameworks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      # Pure-stdlib engines — no dependencies to install. The validation harness
      # exits non-zero if the engine ever auto-clears a true match (the
      # false-negative safety gate), so this step IS the safety guarantee.
      - name: Sanctions name-screening — false-negative safety gate + evidence
        run: |
          cd frameworks/sanctions-name-screening
          python3 run_validation.py --seed 42 --watchlist 4000 --alerts 50000 --no-write

      - name: Transaction monitoring — false-negative safety gate + evidence
        run: |
          cd frameworks/transaction-monitoring
          python3 run_validation.py --seed 42 --customers 5000 --alerts 50000 --no-write

      - name: Customer risk rating — floor-safety / discrimination / monotonicity gate
        run: |
          cd frameworks/customer-risk-rating
          python3 run_validation.py --seed 42 --customers 50000 --no-write

      - name: Adverse-media screening — false-negative safety gate + evidence
        run: |
          cd frameworks/adverse-media-screening
          python3 run_validation.py --seed 42 --subjects 8000 --hits 50000 --no-write

      - name: On-chain KYT address risk — false-negative safety gate + evidence
        run: |
          cd frameworks/onchain-kyt-address-risk
          python3 run_validation.py --seed 42 --addresses 50000 --no-write

      - name: TM threshold tuning — below-the-line safety gate + evidence
        run: |
          cd frameworks/tm-threshold-tuning
          python3 run_validation.py --seed 42 --rules 12 --population 40000 --no-write

      - name: Watchlist knowledge base — zero-false-merge / delta / feedback gate
        run: |
          cd frameworks/watchlist-knowledge-base
          python3 run_validation.py --seed 42 --entities 3000 --no-write

      - name: PEP screening — false-negative safety gate + evidence
        run: |
          cd frameworks/pep-screening
          python3 run_validation.py --seed 42 --peps 8000 --alerts 50000 --no-write

      - name: Investigations case-file QA — critical-deficiency safety gate + evidence
        run: |
          cd frameworks/investigations-case-qa
          python3 run_validation.py --seed 42 --cases 50000 --no-write

      - name: On-chain OSINT evidence — provenance / reconciliation / determinism gate
        run: |
          cd frameworks/onchain-osint-evidence
          python3 run_validation.py --seed 42 --addresses 400 --transactions 50000 --no-write

      - name: NPA product risk — floor-safety / prohibited-routing / discrimination gate
        run: |
          cd frameworks/npa-product-risk
          python3 run_validation.py --seed 42 --products 50000 --no-write

      - name: Data-quality rules — critical-defect recall + feed-gate evidence
        run: |
          cd frameworks/data-quality-rules
          python3 run_validation.py --seed 42 --records 50000 --no-write

      - name: QA attribute sampling — structural / direction / cross-check / monotonicity gate
        run: |
          cd frameworks/qa-sampling
          python3 run_validation.py --seed 42 --controls 12 --population 40000 --no-write

      - name: Jurisdiction risk — floor-safety / discrimination / monotonicity gate
        run: |
          cd frameworks/jurisdiction-risk
          python3 run_validation.py --seed 42 --jurisdictions 40000 --no-write

      - name: Entity-resolution confidence — dual false-negative / false-merge gate + stability
        run: |
          cd frameworks/entity-resolution-confidence
          python3 run_validation.py --seed 42 --same 160 --different 240 --name-only 80 --trials 6

      - name: Beneficial-ownership resolution — dual false-negative / resolution-integrity gate + stability
        run: |
          cd frameworks/beneficial-ownership-resolution
          python3 run_validation.py --seed 42 --true-owners 160 --below 240 --unresolved 80 --trials 6

      - name: Sanctions ownership aggregation (50-percent rule) — dual false-negative / resolution-integrity gate + stability
        run: |
          cd frameworks/sanctions-ownership-aggregation
          python3 run_validation.py --seed 42 --true-blocked 160 --below 240 --unresolved 80 --trials 6

      - name: Fraud detection — dual miss / false-decline safety gate + stability
        run: |
          cd frameworks/fraud-detection
          python3 run_validation.py --seed 42 --transactions 50000 --trials 6 --no-write

  reference-data:
    # Same philosophy as `evidence`, applied to the committed sample inputs: each
    # framework's reference-data/ pack must be exactly what its own seeded
    # generator produces at the registered small sizes. A pack that no longer
    # reproduces byte-identically fails the build, naming the file that drifted.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Committed reference-data packs re-derive from seed (byte-identical)
        run: python3 _tooling/build_reference_data.py --check
