name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Embedded code blocks parse (standalone)
        run: python3 _tooling/validate_embedded.py standalone

      - name: Embedded code blocks parse (methodology)
        run: python3 _tooling/validate_embedded.py methodology

      - name: BASE.md in sync with methodology sources
        run: python3 _tooling/build_base.py --check

      - name: Two-file rule — self-containment and pairing budget
        run: python3 _tooling/validate_self_containment.py

  frameworks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pure-stdlib engines — no dependencies to install. The validation harness
      # exits non-zero if the engine ever auto-clears a true match (the
      # false-negative safety gate), so this step IS the safety guarantee.
      - name: Sanctions name-screening — false-negative safety gate + evidence
        run: |
          cd frameworks/sanctions-name-screening
          python3 run_validation.py --seed 42 --watchlist 4000 --alerts 50000 --no-write

      - name: Transaction monitoring — false-negative safety gate + evidence
        run: |
          cd frameworks/transaction-monitoring
          python3 run_validation.py --seed 42 --customers 5000 --alerts 50000 --no-write

      - name: Customer risk rating — floor-safety / discrimination / monotonicity gate
        run: |
          cd frameworks/customer-risk-rating
          python3 run_validation.py --seed 42 --customers 50000 --no-write

      - name: Adverse-media screening — false-negative safety gate + evidence
        run: |
          cd frameworks/adverse-media-screening
          python3 run_validation.py --seed 42 --subjects 8000 --hits 50000 --no-write

      - name: On-chain KYT address risk — false-negative safety gate + evidence
        run: |
          cd frameworks/onchain-kyt-address-risk
          python3 run_validation.py --seed 42 --addresses 50000 --no-write

      - name: TM threshold tuning — below-the-line safety gate + evidence
        run: |
          cd frameworks/tm-threshold-tuning
          python3 run_validation.py --seed 42 --rules 12 --population 40000 --no-write

      - name: Watchlist knowledge base — zero-false-merge / delta / feedback gate
        run: |
          cd frameworks/watchlist-knowledge-base
          python3 run_validation.py --seed 42 --entities 3000 --no-write
